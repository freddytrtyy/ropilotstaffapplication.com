<style>
:root{
  --bg:#271809; --panel:#34210f; --line:#5a3a1a; --text:#fff1e0; --muted:#d2b693;
  --orange:#ff7a1a; --orange-ink:#2a1300; --gold:#ffc61a; --field:#201307; --ok:#7bd88f;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#fff4e6; --panel:#ffffff; --line:#f0c9a0; --text:#2a1604; --muted:#7a5430;
    --orange:#e8630a; --orange-ink:#ffffff; --gold:#b87400; --field:#fffaf3; --ok:#1f7a35; color-scheme:light;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 72px}
header{display:flex;gap:22px;align-items:center;margin-bottom:34px}
.logo{flex:none;width:112px;height:112px;border-radius:26px;overflow:hidden;background:#271809}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.16);display:block}
h1{font:700 clamp(2.2rem,7vw,3.4rem)/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:0 0 8px;color:var(--orange);letter-spacing:.01em}
header p{margin:0;color:var(--muted);max-width:44ch}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:16px;margin:0 0 20px;padding:22px 22px 8px}
legend{font:700 1.45rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--gold);padding:0 8px;margin-left:-8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:560px){.row{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}}
label{display:block;font-weight:600;margin:0 0 16px}
label small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.check input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--orange);flex:none}
button{font:700 1.15rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;border:0;border-radius:12px;padding:14px 26px;background:var(--orange);color:var(--orange-ink);cursor:pointer}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--orange);border:2px solid var(--orange)}
#result{display:none;margin-top:28px;border:2px solid var(--orange);border-radius:16px;background:var(--panel);padding:22px}
#result.show{display:block}
#result h2{font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px;color:var(--orange)}
#result p{margin:0 0 14px;color:var(--muted)}
#out{min-height:260px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.actions{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
#msg{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:no-preference){#result.show{animation:rise .35s ease-out}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Your answers</legend>
    <label>Past experience
      <small>Moderating, supporting, or building on Roblox or Discord. Say “none” if this is your first time.</small>
      <textarea name="exp" required></textarea>
    </label>
    <label>Why do you want to join Ropilot staff?
      <textarea name="why" required></textarea>
    </label>
    <label>A member keeps posting off-topic and argues when you ask them to stop. What do you do?
      <textarea name="scenario" required></textarea>
    </label>
  </fieldset>

  <fieldset>
    <legend>Before you send</legend>
    <label class="check"><input type="checkbox" name="agree" required>
      <span>I’ve read the community rules, I’ll keep staff matters private, and everything I wrote is true.</span></label>
  </fieldset>

  <button type="submit">Create my application</button>
</form>

<section id="result" aria-live="polite">
  <h2>Your application is ready</h2>
  <p>Copy it and send it to the Ropilot staff team. Nothing has been submitted yet.</p>
  <textarea id="out" readonly aria-label="Formatted application"></textarea>
  <div class="actions">
    <button type="button" id="copy">Copy application</button>
    <button type="button" class="ghost" id="edit">Edit answers</button>
    <span id="msg"></span>
  </div>
</section>
</main>

<script>
(function(){
  var f=document.getElementById('f'),res=document.getElementById('result'),out=document.getElementById('out'),msg=document.getElementById('msg');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d=new FormData(f),g=function(k){return String(d.get(k)||'').trim()};
    out.value=[
      '**Ropilot Staff Application**','',
      'Roblox username: '+g('roblox'),
      'Discord username: '+g('discord'),
      'Age: '+g('age'),
      'Time zone: '+g('tz'),
      'Role: '+g('role'),
      'Weekly hours: '+g('hours'),'',
      '**Past experience**',g('exp'),'',
      '**Why Ropilot staff?**',g('why'),'',
      '**Scenario: off-topic member**',g('scenario'),'',
      'Agreed to rules and confidentiality: yes'
    ].join('\n');
    msg.textContent='';
    res.classList.add('show');
    res.scrollIntoView({behavior:'smooth',block:'start'});
  });
  document.getElementById('copy').addEventListener('click',function(){
    var ok=function(){msg.textContent='Copied'};
    var fail=function(){out.select();msg.textContent='Press Ctrl+C to copy'};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out.value).then(ok,function(){try{out.select();document.execCommand('copy')?ok():fail()}catch(x){fail()}})}
      else{out.select();document.execCommand('copy')?ok():fail()}
    }catch(x){fail()}
  });
  document.getElementById('edit').addEventListener('click',function(){
    res.classList.remove('show');f.scrollIntoView({behavior:'smooth'});
  });
})();
</script>
</body>
</html>
